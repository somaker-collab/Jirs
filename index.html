<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HimalAI Ventures</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="nav container">
        <div class="brand">HimalAI Ventures</div>
        <button id="langToggle" class="lang-btn" aria-label="Switch language">नेपाली</button>
      </nav>

      <div class="container hero-content">
        <p class="tag" data-i18n="tag"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="subtitle" data-i18n="hero_subtitle"></p>
        <div class="cta-row">
          <a href="#products" class="btn primary" data-i18n="cta_products"></a>
          <a href="#contact" class="btn ghost" data-i18n="cta_contact"></a>
        </div>
      </div>
    </header>

    <main>
      <section class="section container" id="about">
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_body"></p>
      </section>

      <section class="section alt" id="products">
        <div class="container">
          <h2 data-i18n="products_title"></h2>
          <div class="grid cards">
            <article class="card">
              <h3 data-i18n="product_1_title"></h3>
              <p data-i18n="product_1_body"></p>
            </article>
            <article class="card">
              <h3 data-i18n="product_2_title"></h3>
              <p data-i18n="product_2_body"></p>
            </article>
            <article class="card">
              <h3 data-i18n="product_3_title"></h3>
              <p data-i18n="product_3_body"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section container" id="market">
        <h2 data-i18n="market_title"></h2>
        <div class="grid split">
          <div class="card soft">
            <h3 data-i18n="market_np_title"></h3>
            <ul>
              <li data-i18n="market_np_1"></li>
              <li data-i18n="market_np_2"></li>
              <li data-i18n="market_np_3"></li>
            </ul>
          </div>
          <div class="card soft">
            <h3 data-i18n="market_global_title"></h3>
            <ul>
              <li data-i18n="market_global_1"></li>
              <li data-i18n="market_global_2"></li>
              <li data-i18n="market_global_3"></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="section alt" id="roadmap">
        <div class="container">
          <h2 data-i18n="roadmap_title"></h2>
          <ol class="timeline">
            <li data-i18n="roadmap_1"></li>
            <li data-i18n="roadmap_2"></li>
            <li data-i18n="roadmap_3"></li>
            <li data-i18n="roadmap_4"></li>
          </ol>
        </div>
      </section>

      <section class="section container" id="contact">
        <h2 data-i18n="contact_title"></h2>
        <p data-i18n="contact_body"></p>
        <p><strong>Email:</strong> hello@himalai.ventures</p>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer"></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
